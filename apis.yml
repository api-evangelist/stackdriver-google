aid: stackdriver-google
name: Stackdriver (Google)
description: >-
  Stackdriver is the former name of the Google Cloud Operations suite, Google's
  integrated observability platform for applications and infrastructure running on
  Google Cloud, hybrid, and multi-cloud environments. Rebranded to Google Cloud
  Operations in 2020, the suite bundles Cloud Monitoring (metrics, dashboards,
  uptime checks, and alerting), Cloud Logging (centralized log storage, search,
  and analysis), Cloud Trace (distributed tracing), Error Reporting (automatic
  error aggregation), and Cloud Profiler (continuous CPU and memory profiling).
  Each capability is exposed as a REST API (Cloud Monitoring API v3, Cloud Logging
  API v2, Cloud Trace API v2, Error Reporting API, Cloud Profiler API) with first-party
  client libraries across Python, Node.js, Go, Java, Ruby, PHP, and .NET, and is
  governed by Google Cloud's authentication, IAM, deprecation, and status-page
  practices.
